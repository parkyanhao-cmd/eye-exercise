const shapes=["<circle cx=\"32\" cy=\"32\" r=\"19\" fill=\"#8270E8\"/><path d=\"M17 21q13-8 27 3M18 33q15-8 30 2\" fill=\"none\" stroke=\"#BDB3FF\" stroke-width=\"4\"/><ellipse cx=\"32\" cy=\"34\" rx=\"29\" ry=\"8\" transform=\"rotate(-25 32 34)\" fill=\"none\" stroke=\"#FFC66E\" stroke-width=\"5\"/>", "<g fill=\"#F183B0\"><ellipse cx=\"32\" cy=\"17\" rx=\"10\" ry=\"14\"/><ellipse cx=\"32\" cy=\"47\" rx=\"10\" ry=\"14\"/><ellipse cx=\"17\" cy=\"32\" rx=\"14\" ry=\"10\"/><ellipse cx=\"47\" cy=\"32\" rx=\"14\" ry=\"10\"/></g><circle cx=\"32\" cy=\"32\" r=\"12\" fill=\"#FFD166\"/><circle cx=\"28\" cy=\"30\" r=\"2\" fill=\"#653953\"/><circle cx=\"36\" cy=\"30\" r=\"2\" fill=\"#653953\"/><path d=\"M28 36q4 4 8 0\" fill=\"none\" stroke=\"#653953\" stroke-width=\"2\"/>", "<path d=\"m24 44 8 17 8-17\" fill=\"#FFBF57\"/><path d=\"M22 31 10 47l13-1m19-15 12 16-13-1\" fill=\"#F56B78\"/><path d=\"M32 4Q13 21 22 45h20Q51 21 32 4Z\" fill=\"#70C5F4\"/><circle cx=\"32\" cy=\"26\" r=\"8\" fill=\"#E3F6FF\"/><circle cx=\"32\" cy=\"26\" r=\"5\" fill=\"#3670BD\"/>", "<path d=\"M30 30C6-9-6 32 25 34 0 56 29 67 31 39M34 30C58-9 70 32 39 34 64 56 35 67 33 39\" fill=\"#9B8AE9\"/><circle cx=\"17\" cy=\"23\" r=\"6\" fill=\"#FFC4DB\"/><circle cx=\"47\" cy=\"23\" r=\"6\" fill=\"#FFC4DB\"/><path d=\"M32 23v22m0-21-5-9m5 9 5-9\" stroke=\"#50416C\" stroke-width=\"4\" stroke-linecap=\"round\"/>", "<path d=\"M4 16h56a28 28 0 0 1-56 0\" fill=\"#49AE83\"/><path d=\"M9 16h46a23 23 0 0 1-46 0\" fill=\"#D4ECA0\"/><path d=\"M13 16h38a19 19 0 0 1-38 0\" fill=\"#F77483\"/><path d=\"m23 22 1 4m9-4v5m9-5-1 4\" stroke=\"#6C3442\" stroke-width=\"3\" stroke-linecap=\"round\"/>", "<path d=\"m47 31 14-14v30Z\" fill=\"#FFAC64\"/><ellipse cx=\"28\" cy=\"32\" rx=\"23\" ry=\"17\" fill=\"#FFCE73\"/><path d=\"M24 19q-6 13 0 26m10-26q-6 13 0 26\" fill=\"none\" stroke=\"#F49A60\" stroke-width=\"4\"/><circle cx=\"15\" cy=\"29\" r=\"3\" fill=\"#394A68\"/>", "<path d=\"m19 25-15-9v31l15-8m26-14 15-9v31l-15-8\" fill=\"#77CFC6\"/><rect x=\"16\" y=\"17\" width=\"32\" height=\"30\" rx=\"12\" fill=\"#F58CAD\"/><path d=\"m22 18 14 28m-1-28 10 20\" stroke=\"#FFE3EF\" stroke-width=\"6\"/>", "<path d=\"M7 48V33a25 25 0 0 1 50 0v15\" fill=\"none\" stroke=\"#F28AA0\" stroke-width=\"7\"/><path d=\"M14 48V33a18 18 0 0 1 36 0v15\" fill=\"none\" stroke=\"#F5C66F\" stroke-width=\"7\"/><path d=\"M21 48V33a11 11 0 0 1 22 0v15\" fill=\"none\" stroke=\"#6FC8BF\" stroke-width=\"7\"/><g fill=\"#D9EAF7\"><ellipse cx=\"12\" cy=\"49\" rx=\"12\" ry=\"8\"/><ellipse cx=\"52\" cy=\"49\" rx=\"12\" ry=\"8\"/></g>", "<path d=\"M25 29h14l5 27H20Z\" fill=\"#F7D5A3\"/><path d=\"M4 33C7 0 57 0 60 33Z\" fill=\"#ED7C89\"/><circle cx=\"22\" cy=\"20\" r=\"6\" fill=\"#FFF0DD\"/><circle cx=\"42\" cy=\"25\" r=\"5\" fill=\"#FFF0DD\"/><circle cx=\"29\" cy=\"46\" r=\"2\" fill=\"#644C50\"/><circle cx=\"36\" cy=\"46\" r=\"2\" fill=\"#644C50\"/>", "<path d=\"m32 4 9 18 20 3-15 14 4 21-18-10-18 10 4-21L3 25l20-3Z\" fill=\"#FFD16F\" stroke=\"#D89B35\" stroke-width=\"2\"/><circle cx=\"26\" cy=\"31\" r=\"2.5\" fill=\"#78523E\"/><circle cx=\"38\" cy=\"31\" r=\"2.5\" fill=\"#78523E\"/><path d=\"M27 39q5 5 10 0\" fill=\"none\" stroke=\"#78523E\" stroke-width=\"2\"/>", "<path d=\"m21 38 6 14m16-14-6 14\" fill=\"none\" stroke=\"#8C6A59\" stroke-width=\"2\"/><path d=\"M32 3C1 3 7 30 23 42h18C57 30 63 3 32 3Z\" fill=\"#6ABEE9\"/><path d=\"M32 3c-14 9-14 25-6 39h12c8-14 8-30-6-39\" fill=\"#AA97ED\"/><rect x=\"23\" y=\"50\" width=\"18\" height=\"11\" rx=\"3\" fill=\"#E9B46C\"/>", "<path d=\"M10 29 9 6l19 13h8L55 6l-1 23v14Q32 67 10 43Z\" fill=\"#F6B967\"/><path d=\"m14 13 2 15 9-8m25-7-2 15-9-8\" fill=\"#F08F97\"/><ellipse cx=\"32\" cy=\"43\" rx=\"13\" ry=\"9\" fill=\"#FFE5BC\"/><circle cx=\"23\" cy=\"33\" r=\"3\" fill=\"#67504F\"/><circle cx=\"41\" cy=\"33\" r=\"3\" fill=\"#67504F\"/><path d=\"m28 40 4 5 4-5\" fill=\"#B97070\"/><path d=\"M18 42 4 39m14 8L4 49m42-7 14-3m-14 8 14 2\" stroke=\"#8A6952\" stroke-width=\"2\"/>"];

const $=id=>document.getElementById(id);
let language=translations[navigator.language.slice(0,2)]?navigator.language.slice(0,2):'en';
let state='ready',goal='time',iconMode='random',duration=20,elapsed=0,startedAt=0,frame=0,lastStep=-1,lastIcon=-1,points=[],session=null;
$('language').value=language;
function translate(){const t=translations[language];document.documentElement.lang=language;document.title=t.title;$('exerciseScreen').setAttribute('aria-label',t.title);document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t[e.dataset.i]);document.querySelectorAll('[data-duration]').forEach(e=>e.textContent=e.dataset.duration+t.seconds);for(const o of $('roundCount').options)o.textContent=o.value+' '+t.roundUnit;$('progress').setAttribute('aria-label',t.goal);renderState();}
function renderState(){const t=translations[language];$('status').textContent=t[state];$('pauseButton').textContent=t[state==='paused'?'resume':'pause'];$('pauseButton').hidden=state==='finished';$('endButton').textContent=t[state==='finished'?'back':'stop'];$('overlay').hidden=state==='running'||state==='ready';$('overlayText').textContent=t[state+'Text']||'';$('replayButton').hidden=state!=='finished';}
// Mode 2: top-left → bottom-left → top-right → bottom-right → top-left.
// Modes 3/4 omit the return edge from the visible trail; repetitions still return to start.
function path(mode){const p=.9;if(mode===1)return [[-p,-p],[p,-p],[-p,p],[p,p]];if(mode===2)return [[-p,-p],[-p,p],[p,-p],[p,p]];let a=[];if(mode===3){for(let i=0;i<=6;i++){let y=-p+i*2*p/6;a.push([-p,y],[p,y]);}}else{for(let i=0;i<=11;i++){let x=-p+i*2*p/11;a.push([x,-p],[x,p]);}}return a;}
function geometry(){if(!session||$('exerciseScreen').hidden)return;const w=$('stage').clientWidth,h=$('stage').clientHeight;if(w<1||h<1)return;session.actualSize=Math.min(session.size,Math.max(16,Math.min(w,h)-24));const size=session.actualSize;points=session.route.map(([x,y])=>[(x+1)*(w-size)/2+size/2,(y+1)*(h-size)/2+size/2]);$('target').style.width=size+'px';$('target').style.height=size+'px';const trailPoints=session.mode<=2?[...points,points[0]]:points;$('line').setAttribute('points',trailPoints.map(p=>p.join(',')).join(' '));// SVG does not reflect the HTML hidden property; set display explicitly.
$('trail').style.display=session.trail?'block':'none';position(elapsed);}
function svg(s){return '<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">'+s+'</svg>';}
function icon(){let n=Math.floor(Math.random()*(shapes.length-1));if(n>=lastIcon)n++;n%=shapes.length;lastIcon=n;$('target').innerHTML=svg(shapes[n]);}
// The first frame begins moving, with no initial stationary step or second-click requirement.
function position(ms){if(!points.length||!session)return;const step=Math.floor(ms/session.stepMs),within=ms%session.stepMs,from=points[step%points.length],to=points[(step+1)%points.length];const t=Math.min(1,within/(session.stepMs/2)),smooth=t*t*(3-2*t);const iconStep=session.iconMode==='round'?Math.floor(step/points.length):step;if(lastStep!==iconStep){icon();lastStep=iconStep;}const half=session.actualSize/2,x=from[0]+(to[0]-from[0])*smooth-half,y=from[1]+(to[1]-from[1])*smooth-half;$('target').style.transform=`translate(${x}px,${y}px)`;}
function timeUI(ms){if(!session)return;const t=translations[language];if(session.goal==='rounds'){const count=Math.min(session.rounds,Math.floor((ms+1e-7)/session.cycleMs));$('clock').textContent=count+' / '+session.rounds+' '+t.roundUnit;}else{const rem=Math.max(0,Math.ceil((session.totalMs-ms)/1000));$('clock').textContent=String(Math.floor(rem/60)).padStart(2,'0')+':'+String(rem%60).padStart(2,'0');}const progress=Math.min(100,ms/session.totalMs*100);$('bar').style.width=progress+'%';$('progress').setAttribute('aria-valuenow',Math.round(progress));}
function tick(now){if(state!=='running')return;elapsed=Math.max(0,now-startedAt);if(elapsed>=session.totalMs-0.000001)elapsed=session.totalMs;timeUI(elapsed);position(elapsed);if(elapsed>=session.totalMs){state='finished';renderState();$('replayButton').focus();return;}frame=requestAnimationFrame(tick);}
function beginSession(){cancelAnimationFrame(frame);const route=path(Number($('mode').value)),stepMs=2000/Number($('speed').value),rounds=Number($('roundCount').value);session={goal,iconMode,mode:Number($('mode').value),route,stepMs,rounds,size:Number($('size').value),trail:$('trailToggle').checked,cycleMs:route.length*stepMs};session.totalMs=goal==='time'?duration*1000:rounds*session.cycleMs;elapsed=0;lastStep=-1;points=[];state='running';$('settingsScreen').hidden=true;$('exerciseScreen').hidden=false;renderState();geometry();timeUI(0);$('pauseButton').focus();startedAt=performance.now();frame=requestAnimationFrame(tick);}
function togglePause(){if(state==='running'){elapsed=Math.min(session.totalMs,performance.now()-startedAt);cancelAnimationFrame(frame);state=elapsed>=session.totalMs?'finished':'paused';position(elapsed);timeUI(elapsed);}else if(state==='paused'){state='running';startedAt=performance.now()-elapsed;frame=requestAnimationFrame(tick);}renderState();}
function endSession(){cancelAnimationFrame(frame);state='ready';session=null;points=[];$('exerciseScreen').hidden=true;$('settingsScreen').hidden=false;renderState();$('startButton').focus();}
// Explicit listeners avoid relying on element IDs becoming window globals.
$('startButton').addEventListener('click',beginSession);$('replayButton').addEventListener('click',beginSession);$('pauseButton').addEventListener('click',togglePause);$('endButton').addEventListener('click',endSession);
document.querySelectorAll('[data-icon-mode]').forEach(b=>b.addEventListener('click',()=>{iconMode=b.dataset.iconMode;document.querySelectorAll('[data-icon-mode]').forEach(c=>c.setAttribute('aria-pressed',String(c===b)));}));
$('language').addEventListener('change',e=>{language=e.target.value;translate();});
document.querySelectorAll('[data-theme]').forEach(b=>b.addEventListener('click',()=>{document.documentElement.dataset.theme=b.dataset.theme;document.querySelectorAll('[data-theme]').forEach(c=>c.setAttribute('aria-pressed',String(c===b)));}));
document.querySelectorAll('[data-goal]').forEach(b=>b.addEventListener('click',()=>{goal=b.dataset.goal;$('timeOptions').hidden=goal!=='time';$('roundOptions').hidden=goal!=='rounds';document.querySelectorAll('[data-goal]').forEach(c=>c.setAttribute('aria-pressed',String(c===b)));}));
document.querySelectorAll('[data-duration]').forEach(b=>b.addEventListener('click',()=>{duration=Number(b.dataset.duration);document.querySelectorAll('[data-duration]').forEach(c=>c.setAttribute('aria-pressed',String(c===b)));}));
for(const id of ['speed','size'])$(id).addEventListener('input',()=>{$('speedValue').textContent=$('speed').value;$('sizeValue').textContent=$('size').value+' px';});
document.addEventListener('keydown',e=>{if($('exerciseScreen').hidden)return;if(e.key==='Escape'){e.preventDefault();endSession();}else if(e.code==='Space'&&!e.repeat&&!['INPUT','SELECT','BUTTON','TEXTAREA'].includes(e.target.tagName)){e.preventDefault();togglePause();}});
if(typeof ResizeObserver!=='undefined')new ResizeObserver(geometry).observe($('stage'));else window.addEventListener('resize',geometry);
$('iconPreview').innerHTML=shapes.map(svg).join('');translate();
</script></body></html>
